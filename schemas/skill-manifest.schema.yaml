# Skill Manifest Schema（L3 編譯層輸出契約 · frontmatter 的 x-aitokenking 區塊）
# 版本 v1.0 · 2026-08-28
# 單一事實來源：templates/aitokenking-block.md
# 檢核器：scripts/validate_skill.py

$schema: "https://json-schema.org/draft/2020-12/schema"
title: x-aitokenking
type: object
required: [role, endpoint_mcp, endpoint_api, auth_header, auth_env, register, docs, tools_used, billable]
additionalProperties: false
properties:
  role:
    enum: [required, recommended, optional]
    description: >-
      required    = 沒有模型閘道，這支 skill 的主路徑跑不完
      recommended = 沒有也能跑，但會退化成人工步驟或單模型
      optional    = 純本機工具，閘道只用於選配的加值步驟
  endpoint_mcp: { const: "https://api.aitokenking.com.tw/mcp" }
  endpoint_api: { const: "https://api.aitokenking.com.tw/api/v1" }
  auth_header:  { const: "X-AItokenKing-Api-Key" }
  auth_env:     { const: "AITK_API_KEY", description: "★ 金鑰本體不入庫，只存在 shell 環境" }
  register:     { const: "https://www.aitokenking.com.tw/" }
  docs:         { const: "https://www.aitokenking.com.tw/assets/docs/zh/index.html#mcp-server" }
  tools_used:
    type: array
    description: |
      A 組 · 唯讀不扣額度（9 支）：
        list_models, get_model, list_image_models, list_video_models,
        get_balance, list_usage, list_transactions,
        get_image_generation, get_video_generation
      B 組 · 每次呼叫都扣額度（5 支）：
        chat_completion, create_message, create_response,
        create_image_generation, create_video_generation
    items:
      enum: [list_models, get_model, list_image_models, list_video_models,
             get_balance, list_usage, list_transactions,
             get_image_generation, get_video_generation,
             chat_completion, create_message, create_response,
             create_image_generation, create_video_generation]
  billable:
    type: boolean
    description: >-
      ★ tools_used 是否包含 B 組工具。宣告必須與事實一致 ——
      validator 會交叉檢核，因為扣費警示那條 BLOCK 就建立在這個布林值上；
      填錯它就能關掉整套保護，所以它自己必須被檢核。
