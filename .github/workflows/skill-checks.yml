name: skill-checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ★ 先跑回歸測試確認尺沒壞，再用尺去量 skill。
      #   順序不可交換：一把壞掉的尺，量什麼都會過。
      - name: 回歸測試（檢核器自己）
        run: python3 scripts/test_validate.py

      - name: 目錄管線回歸測試（schema ＋ SQL 產生器）
        run: python3 scripts/test_catalog.py

      - name: 安裝 PyYAML（case 檢核需要）
        run: pip install --quiet pyyaml

      - name: 案例回歸測試（technique-card gate ＋ 證據帳本）
        run: python3 scripts/test_case.py

      - name: 案例檢核（boundary/gaps/claims/security_findings 不得留白）
        run: python3 scripts/validate_case.py --all

      - name: 證據帳本漂移檢查（已核可的回填必須寫回技巧卡）
        run: python3 scripts/evidence_ledger.py --all --check

      - name: 草稿三嵌入點檢核（drafts/）
        run: python3 scripts/validate_skill.py --drafts

      - name: Registry ＋ Dashboard 回歸測試
        run: python3 scripts/test_registry.py

      - name: Registry 是否過期
        run: python3 scripts/build_registry.py --check

      - name: Provider capsule 同步檢查（不得人工複製）
        run: python3 scripts/sync_provider_capsule.py --check

      - name: Plugin / marketplace manifest 合法性
        run: |
          python3 -c "import json;[json.load(open(f)) for f in ['.claude-plugin/plugin.json','.claude-plugin/marketplace.json']];print('manifests OK')"

      - name: 三嵌入點 ＋ 安全閘 ＋ 斷鏈檢核（全部 skill）
        run: python3 scripts/validate_skill.py --all
